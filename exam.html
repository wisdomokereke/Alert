<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Online Examination | Ogbonnaya Onu Polytechnic</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ========================================
         EXAM HEADER
    ========================================= -->

    <header class="exam-header">
      <div>
        <h1>Ogbonnaya Onu Polytechnic</h1>

        <p>Online Examination</p>
      </div>

      <div class="timer">
        Time Left:

        <span id="timer"> 30:00 </span>
      </div>
    </header>

    <!-- ========================================
         EXAM CONTENT
    ========================================= -->

    <main class="exam-container">
      <!-- Exam Information -->

      <section class="exam-info">
        <div>
          <strong> Student: </strong>

          <span id="studentName"> Loading... </span>
        </div>

        <div>
          <strong> Course: </strong>

          <span id="courseName"> English </span>
        </div>
      </section>

      <!-- Questions -->

      <section id="questionContainer">
        <div class="question-card">
          <p>Loading examination questions...</p>
        </div>
      </section>

      <!-- Submit -->

      <button id="submitExam" class="primary-btn" type="button">
        Submit Examination
      </button>
    </main>

    <!-- ========================================
         SUPABASE
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/supabase.js"></script>

    <!-- ========================================
         CURRENT PROTOTYPE QUESTIONS
    ========================================= -->

    <script src="js/questions.js"></script>

    <!-- ========================================
         EXAM LOGIC
    ========================================= -->

    <script src="js/exam.js"></script>
  </body>
</html>
